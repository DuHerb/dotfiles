unbind r
bind r source-file ~/.tmux.conf

set -g mouse on
set -g prefix ^t

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#latest'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin 'hoshiya4522/tokyo-night-tmux'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'

# tmux-continuum config
set -g @continuum-restore 'on'

# theme config
set -g @catppuccin_flavour 'frappe' # or frappe, macchFiato, mocha
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_default_color "#7aa2f7"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_color "#ff9e64"

set -g @catppuccin_status_modules_right "directory"
set -g @catppuccin_directory_color "#f7768e"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_modules_left "session"
set -g status-position top

set -g @catppuccin_directory_text "#{pane_current_path}"

set -g base-index 1  # Start windows counts at 1
set -g renumber-windows on # renumber-windows if any are deleted
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
